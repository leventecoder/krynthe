<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alap HTML5 Sablon</title>
    
    <style>
        /* CSS Változók a könnyű témázhatóságért */
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
        }

        /* Sötét mód stílusai */
        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        /* Alapértelmezett beállítások */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Fejléc stílusa */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Fő tartalom elrendezése */
        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Gomb stílusok */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Lábléc stílusa */
        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <header>
        <h2>A Weboldalam</h2>
        <button id="themeToggle">Sötét / Világos mód</button>
    </header>

    <main>
        <div class="card">
            <h1>Üdvözöllek a weboldalon!</h1>
            <p>Ez egy letisztult, modern HTML5 alapstruktúra CSS beállításokkal és egy egyszerű JavaScript interakcióval.</p>
            <br>
            <button id="alertBtn">Kattints rám!</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Minden jog fenntartva.</p>
    </footer>

    <script>
        // Sötét/Világos mód váltása
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Interaktív gomb eseménykezelő
        const alertBtn = document.getElementById('alertBtn');
        alertBtn.addEventListener('click', () => {
            alert('A gomb működik!');
        });
    </script>
</body>
</html>
